name: Build Extension ZIP

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get version from manifest
        id: version
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Create extension ZIP
        run: |
          zip -r "xt1-translate-v${{ steps.version.outputs.version }}.zip" \
            manifest.json \
            background.js \
            content.js \
            options.js \
            options.html \
            options.css \
            popup.js \
            popup.html \
            popup.css \
            icons/ \
            _locales/

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: xt1-translate-v${{ steps.version.outputs.version }}
          path: xt1-translate-v${{ steps.version.outputs.version }}.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: xt1-translate-v${{ steps.version.outputs.version }}.zip
