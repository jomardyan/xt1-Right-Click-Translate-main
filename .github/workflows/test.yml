name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Verify GNU Make command discovery and recipe graph
        run: |
          make help
          make -n build package clean
      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
